name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/documentation.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # No automatic rebuild on SDK changes: bump `ref:` to a new release
      # tag and push (or run workflow_dispatch after bumping it) to pick up
      # SDK doc changes. See docs/CONTRIBUTING.md for contributor-facing detail.
      - name: Check out Python SDK
        uses: actions/checkout@v7
        with:
          repository: makimoto-ai/makimoto-python
          ref: v0.1.1
          path: python-sdk

      - name: Import SDK documentation
        run: |
          mkdir -p docs/sdks/python
          cp -R python-sdk/docs/. docs/sdks/python/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Install SDK for API reference generation
        run: pip install -e ./python-sdk

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
