site_name: Kawa Docs
site_description: Documentation for Kawa, Makimoto's open-source transcription API.
site_url: https://docs.makimoto.ai/

repo_name: makimoto-ai/kawa
repo_url: https://github.com/makimoto-ai/kawa
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - How It Works: concepts/index.md
  - Service:
      - Overview: service/index.md
      - Authentication: service/authentication.md
      - Walkthrough: service/walkthrough.md
      - API Reference: service/api-reference.md
  - SDKs:
      - Python:
          - Overview: sdks/python/index.md
          - Installation: sdks/python/installation.md
          - Usage: sdks/python/usage.md
          - API Reference: sdks/python/api-reference.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Contributing: CONTRIBUTING.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/logo-gradient-on-dark.svg
  favicon: assets/brand/mark-gradient.svg
  # Raleway is self-hosted (see stylesheets/fonts.css) so no request goes to
  # Google Fonts before the visitor has answered the cookie banner.
  font: false
  # Dark-only, matching makimoto.ai. Colours live in stylesheets/tokens.css.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            members_order: source

# Expands `::: openapi METHOD /path` directives into reference tables
# generated from docs/openapi.json (see the module docstring).
hooks:
  - hooks/openapi_reference.py

exclude_docs: |
  .venv/
  includes/

extra_css:
  - stylesheets/fonts.css
  - stylesheets/tokens.css
  - stylesheets/base.css
  - stylesheets/components.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs/includes]
      check_paths: true

copyright: >-
  Kawa is developed in the open by Makimoto, operated by Makimoto Technology Pte Ltd,
  a wholly-owned subsidiary of the Toku Group.
  <a href="#__consent" class="md-copyright__consent">Change cookie settings</a>

extra:
  analytics:
    provider: google
    property: G-1E67V9L3WZ
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognise your repeated visits and preferences,
      as well as to measure the effectiveness of our documentation.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics: >-
        Google Analytics: records which pages are visited so we know what to improve
      github: >-
        GitHub: loads the repository's latest version, stars and forks from GitHub
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/makimoto-ai/kawa
      name: GitHub
    - icon: fontawesome/solid/globe
      link: https://makimoto.ai
      name: makimoto.ai
    - icon: fontawesome/solid/envelope
      link: mailto:contact@makimoto.ai
      name: Email
    - icon: fontawesome/brands/discord
      link: https://discord.gg/rdFVTa8SmX
      name: Discord

strict: true
